name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Each gate runs even if an earlier one failed. Without this the job is
      # fail-fast, and a single red step hides every step behind it: `tsc`
      # broke on a phantom dependency and `pnpm test:coverage` then went
      # weeks without running once, so "CI is red" said nothing about
      # whether the tests passed. `!cancelled()` (not `always()`) so a
      # cancelled run still stops immediately.
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm exec tsc --noEmit
      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm test:coverage
