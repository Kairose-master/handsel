# Daily reading of how much bounty-labelled work is visible on GitHub.
#
# This exists because docs/product-thesis.md makes a strong claim — that the
# binding constraint on this whole project is demand rather than infrastructure
# — on three anecdotes. An instrument that could contradict us is worth more
# than another feature, and the series is public so anyone can check it.
#
# It counts labelled open issues. It does NOT measure demand for agent labor;
# lib/demand-census.ts says so in its header, at length, on purpose.
#
# No secrets required: GITHUB_TOKEN is issued to the job. Nothing is posted
# anywhere and no other repository is touched — this reads search results and
# appends a row here.
name: Demand census

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demand-census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the script imports lib/demand-census.ts directly for
          # the lead ranking, and Node strips types natively from 22.18. On 20
          # that import throws and the leads step silently reports "skipped".
          node-version: 22
      - name: Take one reading
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/demand-census.mjs
      # The reading is worthless if it stays on the runner. The series row is
      # committed (it is the public instrument); the ranked leads are the
      # day's outreach list — committed too, and attached to the run so a
      # session that cannot call the search API (sessions are bound to their
      # own repositories) can still fetch the list the workflow built.
      - name: Keep the leads
        uses: actions/upload-artifact@v4
        with:
          name: demand-census-leads
          path: |
            data/demand-census/leads.csv
            data/demand-census/series.csv
          if-no-files-found: warn
          retention-days: 14
      - name: Commit the reading
        run: |
          git config user.name "demand-census"
          git config user.email "demand-census@users.noreply.github.com"
          git add data/demand-census/series.csv data/demand-census/leads.csv
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "data(census): $(date -u +%F)"
          git push
