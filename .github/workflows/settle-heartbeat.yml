# Free background heartbeat for platform settlement — calls
# /api/cron/settle every ~5 minutes so graded work pays out even when
# nobody has a dashboard tab open. (GitHub schedules are best-effort;
# actual cadence is usually 5-15 min, which is fine for settlement.)
#
# Requires TWO repo settings, and the URL is not optional:
#   secret   CRON_SECRET   — matching the Vercel env var of the same name
#   variable PLATFORM_URL  — this deployment's origin, e.g. https://xxx.vercel.app
# Settings → Secrets and variables → Actions.
#
# One repo, two deployments (the mainnet market and the testnet rehearsal),
# one schedule: the optional variable PLATFORM_URL_2 adds a second origin to
# the same beat. Both must accept the SAME CRON_SECRET — set the identical
# value in both Vercel projects. One deployment failing still beats the
# other, and the run then fails loudly for the one that broke.
#
# PLATFORM_URL used to be a hardcoded hostname, which was fine while there was
# one deployment and actively dangerous once there were two: a second repo
# created from this one inherits the workflow and would drive the FIRST
# deployment's settlement — quietly, on a 5-minute schedule, with real money on
# the other end. It is now a variable with no default, and the job skips when
# it is unset rather than guessing.
name: Settlement heartbeat

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # A skip must not look like a run.
      #
      # These guards printed a line and exited 0, so an unconfigured heartbeat
      # produced a green tick — 931 consecutive green ticks, in fact, for a job
      # that had never once called the endpoint. Meanwhile nothing settled
      # unless a human had a dashboard tab open, and a delegation sat stranded
      # for days with its escrow locked.
      #
      # Still exit 0, because a fork with no deployment of its own is correctly
      # configured to do nothing and should not fail. But ::warning:: puts a
      # yellow annotation on the run and in the Actions list, which is the
      # difference between "off" and "off and nobody can tell".
      - name: Call /api/cron/settle
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::warning title=Settlement heartbeat is OFF::CRON_SECRET repo secret is not set, so this job did nothing. Until it is set, work only settles while somebody has a dashboard open. Settings → Secrets and variables → Actions."
            echo "CRON_SECRET repo secret is not set — skipping (add it to enable the heartbeat)."
            exit 0
          fi
          if [ -z "${{ vars.PLATFORM_URL }}" ]; then
            echo "::warning title=Settlement heartbeat is OFF::PLATFORM_URL repo variable is not set, so this job did nothing. There is deliberately no default — guessing would point this repo's heartbeat at somebody else's deployment."
            echo "PLATFORM_URL repo variable is not set — skipping."
            echo "There is deliberately no default: guessing would point this repo's heartbeat"
            echo "at somebody else's deployment."
            exit 0
          fi
          # pipefail so a curl failure is reported as a curl failure. The grep
          # below would catch it either way — an empty result has no
          # "ok":true — but "grep found nothing" is a worse first clue than
          # "the request failed".
          #
          # Sequential over every configured origin, and one origin failing
          # never skips the next — a broken testnet must not stop mainnet
          # settlement (or the reverse). The run still FAILS at the end if
          # any beat failed: a check that cannot fail is not a check.
          set -o pipefail
          failed=0
          i=0
          for url in "${{ vars.PLATFORM_URL }}" "${{ vars.PLATFORM_URL_2 }}"; do
            [ -z "$url" ] && continue
            i=$((i+1))
            echo "── beat $i: $url"
            if curl -sS --max-time 300 \
                 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
                 "$url/api/cron/settle" | tee "result-$i.json" \
               && grep -q '"ok":true' "result-$i.json"; then
              echo "── beat $i ok"
            else
              echo "::error title=Settlement heartbeat failed::$url/api/cron/settle did not return ok:true"
              failed=1
            fi
          done
          exit "$failed"
